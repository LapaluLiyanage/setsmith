<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e3e5df" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Setsmith" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>Setsmith</title>
    <script>
      // Apply the saved theme before first paint so there's no light flash in dark mode.
      try {
        var t = localStorage.getItem('setsmith:theme')
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Static so it's present in the raw page source (not just after React mounts), per GetSongBPM's API terms.
         Kept intentionally tiny/subtle rather than removed -- their terms require a visible backlink or they
         can suspend the API key without notice. -->
    <a href="https://getsongbpm.com" rel="noopener" title="BPM & key data via GetSongBPM.com"
      style="position:fixed;right:6px;bottom:6px;z-index:9999;font:7px/1 system-ui,sans-serif;color:#8a8d8680;text-decoration:none;">
      GetSongBPM.com
    </a>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
