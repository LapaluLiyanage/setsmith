<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e3e5df" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>Setsmith</title>
    <script>
      // Apply the saved theme before first paint so there's no light flash in dark mode.
      try {
        var t = localStorage.getItem('setsmith:theme')
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Static so it's present in the raw page source (not just after React mounts), per GetSongBPM's API terms. -->
    <a href="https://getsongbpm.com" rel="noopener"
      style="position:fixed;right:10px;bottom:10px;z-index:9999;font:11px/1 system-ui,sans-serif;color:#8a8d86;text-decoration:none;background:#0009;padding:4px 8px;border-radius:10px;">
      BPM &amp; key data by GetSongBPM.com
    </a>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
